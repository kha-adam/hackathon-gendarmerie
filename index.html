<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Coverage Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

    <div id="dashboard">
        <div id="sidebar">
            <h2>Coverage Area</h2>
            
            <!-- BARRE DE RECHERCHE -->
            <div class="control-group">
                <label for="search-input"><strong>🔍 Rechercher une région / zone :</strong></label>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Ex: Occitanie, Toulouse, Paris...">
                    <button type="button" id="btn-search" class="btn-search">Chercher</button>
                </div>
                <p id="search-status" class="help-text"></p>
            </div>

            <!-- TRACÉ MANUEL ET PAR CLIC -->
            <div class="control-group">
                <button id="draw-toggle-btn">Draw the zone</button>
                <p class="help-text">Or add manually:</p>
                <div class="coords-inputs">
                    <input type="number" id="lat" placeholder="Lat" step="0.001" value="43.604">
                    <input type="number" id="lng" placeholder="Lng" step="0.001" value="1.444">
                </div>
                <button id="btn-add-point">Add Point</button>
            </div>

            <div class="control-group">
                <strong>Zone Points:</strong>
                <ul id="point-list"></ul>
                <button class="danger" id="btn-clear-area">Clear Area</button>
            </div>

            <!-- GESTION DES ZONES -->
            <div class="control-group">
                <button id="btn-save-zone" style="background-color: #28a745;"> Sauvegarder en GeoJSON</button>
            </div>

            <div class="control-group">
                <h3>Zones Sauvegardées</h3>
                <ul id="saved-zones-list">
                    <!-- La liste des zones s'affichera ici dynamiquement via TypeScript -->
                </ul>
                <button class="danger" id="btn-clear-zones">Delete</button>
            </div>
            <div class="control-group" style="background-color: #f8f9fa; padding: 15px; border-radius: 8px;">
                <h3>Optimisation du Déploiement</h3>
    
                <label>Opérateurs Niveau 1 (Rayon ~2km): <span id="val-l1">1</span></label>
                <input type="range" id="slider-l1" min="0" max="10" value="1" style="width: 100%; margin-bottom: 10px;" oninput="document.getElementById('val-l1').innerText = this.value">

                <label>Opérateurs Niveau 2 (Rayon ~5km): <span id="val-l2">0</span></label>
                <input type="range" id="slider-l2" min="0" max="10" value="0" style="width: 100%; margin-bottom: 15px;" oninput="document.getElementById('val-l2').innerText = this.value">

                <button id="btn-optimize" style="background-color: #6f42c1;">Lancer l'Algorithme</button>
    
                <h4 style="margin-top: 15px; color: #333;">Couverture estimée : <span id="coverage-text" style="color: #28a745;">0.00%</span></h4>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <!-- Custom JS -->
    <script type="module" src="./js/app.ts"></script>
</body>
</html>
