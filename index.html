<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gendarmerie Nationale - Planificateur de Couverture Drone</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

    <div id="main-container">
        
        <!-- SECTION SUPÉRIEURE : CARTE ET COMMANDES DE TRACÉ -->
        <div id="top-section">
            <div id="sidebar-top">
                <h2>Contrôles de la Carte</h2>
                
                <!-- BARRE DE RECHERCHE -->
                <div class="control-group">
                    <label for="search-input"><strong>Rechercher une zone :</strong></label>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Ex: Toulouse, Occitanie...">
                        <button type="button" id="btn-search" class="btn-search">Chercher</button>
                    </div>
                    <p id="search-status" class="help-text"></p>
                </div>

                <!-- TRACÉ MANUEL ET PAR CLIC -->
                <div class="control-group">
                    <button id="draw-toggle-btn">Activer le dessin par clic</button>
                    <p class="help-text">Saisie manuelle des coordonnées :</p>
                    <div class="coords-inputs">
                        <input type="number" id="lat" placeholder="Latitude" step="0.001" value="43.604">
                        <input type="number" id="lng" placeholder="Longitude" step="0.001" value="1.444">
                    </div>
                </br>
                    <button id="btn-add-point" class="btn-secondary">Ajouter le point</button>
                </div>

                <!-- LISTE DES POINTS -->
                <div class="control-group">
                    <strong>Points du polygone :</strong>
                    <ul id="point-list"></ul>
                    <button class="btn-danger" id="btn-clear-area">Effacer le tracé actuel</button>
                </div>
            </div>
            
            <div id="map"></div>
        </div>

        <!-- SECTION INFÉRIEURE : GESTION DES ZONES ET ALGORITHME -->
        <div id="bottom-section">
            
            <!-- PANNEAU GAUCHE : SAUVEGARDE DE ZONES -->
            <div class="bottom-panel">
                <h3>Gestion des Zones</h3>
                <div class="control-group">
                    <button id="btn-save-zone" class="btn-primary">Enregistrer la zone (GeoJSON)</button>
                </div>

                <div class="control-group">
                    <h4>Zones enregistrées</h4>
                    <ul id="saved-zones-list"></ul>
                    <button class="btn-danger" id="btn-clear-zones">Effacer l'historique</button>
                </div>
            </div>

            <!-- PANNEAU DROIT : PARAMÈTRES ET OPTIMISATION -->
            <div class="bottom-panel">
                <h3>Algorithme d'Optimisation de Couverture</h3>
                
                <div class="control-grid">
                    <div class="control-group">
                        <label for="slider-t1">Télépilotes TP1: <span id="val-t1" class="badge">1</span></label>
                        <input type="range" id="slider-t1" min="0" max="10" value="1" oninput="document.getElementById('val-t1').innerText = this.value">
                    </div>
                    
                    <div class="control-group">
                        <label for="slider-t2">Télépilotes TP2: <span id="val-t2" class="badge">1</span></label>
                        <input type="range" id="slider-t2" min="0" max="10" value="1" oninput="document.getElementById('val-t2').innerText = this.value">
                    </div>
                </div>

                <div class="control-grid">
                    <div class="control-group">
                        <label for="input-target-coverage">Couverture cible (%) :</label>
                        <div class="input-action-group">
                            <input type="number" id="input-target-coverage" min="1" max="100" value="80">
                            <button id="btn-find-min" class="btn-secondary">Optimiser le nombre de TP</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="input-timeout">Temps maximal de calcul (secondes) :</label>
                        <input type="number" id="input-timeout" min="0" max="300" value="10" placeholder="0 pour illimité">
                    </div>
                </div>

                <button id="btn-optimize" class="btn-action">Lancer le calcul d'optimisation</button>
                
                <div class="result-box">
                    <span><strong>Couverture estimée : </strong><span id="coverage-result" class="result-value">0%</span></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom JS -->
    <script type="module" src="./js/app.ts"></script>
</body>
</html>
