<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Coverage Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

    <div id="dashboard">
        <div id="sidebar">
            <h2>Coverage Area</h2>
            
            <div class="control-group">
                <button id="draw-toggle-btn" onclick="toggleDrawingMode()">
                    📍 Enable Map Click Drawing
                </button>
                <p class="help-text">Or add manually:</p>
                <input type="number" id="lat" placeholder="Lat" step="0.001" value="43.604">
                <input type="number" id="lng" placeholder="Lng" step="0.001" value="1.444">
                <button onclick="addPointFromInput()">Add Point</button>
            </div>

            <div class="control-group">
                <strong>Polygon Points:</strong>
                <ul id="point-list"></ul>
                <button class="danger" onclick="clearPolygon()">Clear Area</button>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="./js/app.js"></script>
</body>
</html>
