<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificateur de Couverture Drone</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; background-color: #f0f2f5; font-family: system-ui, sans-serif; }
        #dashboard { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; height: 80vh; }
        
        /* Styles du panneau latéral */
        #sidebar { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-y: auto; }
        .control-group { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        input[type="number"] { width: calc(50% - 12px); padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 5px; }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        ul { padding-left: 20px; font-size: 0.9em; color: #555; }
        
        /* Style de la carte */
        #map { flex: 3; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #e5e5e5; z-index: 1; }
    </style>
</head>
<body>

    <div id="dashboard">
        <div id="sidebar">
            <h2>Zone de Couverture</h2>
            
            <div class="control-group">
                <label>Ajouter un sommet (Lat / Lng) :</label><br>
                <!-- Coordonnées par défaut centrées sur Toulouse pour tester rapidement -->
                <input type="number" id="lat" placeholder="Lat (ex: 43.604)" step="0.001" value="43.604">
                <input type="number" id="lng" placeholder="Lng (ex: 1.444)" step="0.001" value="1.444">
                <button onclick="addPoint()">Ajouter le point</button>
            </div>

            <div class="control-group">
                <strong>Points du polygone :</strong>
                <ul id="point-list"></ul>
                <button class="danger" onclick="clearPolygon()">Effacer la zone</button>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialisation de la carte
        const map = L.map('map').setView([43.6045, 1.4440], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // 2. État (State) de notre application
        let targetAreaPoints = []; // Tableau stockant nos coordonnées [lat, lng]
        let targetPolygon = null;  // L'objet polygone Leaflet
        let markersGroup = L.layerGroup().addTo(map); // Groupe pour gérer facilement les marqueurs

        // 3. Logique d'ajout de point
        function addPoint() {
            const latInput = document.getElementById('lat');
            const lngInput = document.getElementById('lng');
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);

            if (isNaN(lat) || isNaN(lng)) {
                alert("Veuillez entrer des coordonnées valides.");
                return;
            }

            // Ajouter aux données
            const newPoint = [lat, lng];
            targetAreaPoints.push(newPoint);

            // Ajouter un marqueur visuel sur la carte
            L.marker(newPoint).addTo(markersGroup);

            // Mettre à jour la liste HTML
            const li = document.createElement('li');
            li.textContent = `[${lat.toFixed(3)}, ${lng.toFixed(3)}]`;
            document.getElementById('point-list').appendChild(li);

            // Dessiner ou mettre à jour le polygone
            updatePolygon();

            // Décaler légèrement les valeurs par défaut pour faciliter l'ajout du prochain point
            latInput.value = (lat + 0.005).toFixed(3);
            lngInput.value = (lng + 0.005).toFixed(3);
        }

        // 4. Logique de rendu du polygone
        function updatePolygon() {
            // Si on a moins de 2 points, on ne peut rien tracer
            if (targetAreaPoints.length < 2) return;

            // Si le polygone existe déjà, on met à jour ses coordonnées
            if (targetPolygon) {
                targetPolygon.setLatLngs(targetAreaPoints);
            } else {
                // Sinon on le crée
                targetPolygon = L.polygon(targetAreaPoints, {
                    color: '#28a745',
                    fillColor: '#28a745',
                    fillOpacity: 0.2
                }).addTo(map);
            }
            
            // Ajuster la vue de la carte pour montrer tout le polygone
            map.fitBounds(targetPolygon.getBounds(), { padding: [50, 50] });
        }

        // 5. Réinitialisation
        function clearPolygon() {
            targetAreaPoints = [];
            document.getElementById('point-list').innerHTML = '';
            markersGroup.clearLayers();
            
            if (targetPolygon) {
                map.removeLayer(targetPolygon);
                targetPolygon = null;
            }
        }
    </script>
</body>
</html>
